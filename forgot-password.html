<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — LipaLink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

    <header class="auth-nav">
        <a href="index.html" class="logo">
            <div class="logo-box"><i class="fa-solid fa-link"></i></div>
            LipaLink
        </a>
        <a href="login.html" class="btn-link">← Back to Log In</a>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-box" style="margin: 0 auto 10px auto; width: 42px; height: 42px; font-size: 1.1rem;"><i class="fa-solid fa-key"></i></div>
                <h2>Reset Your Password</h2>
                <p>Enter the email or phone number on your account and we'll send a reset link to your email address.</p>
            </div>

            <form class="auth-form" id="forgotForm" novalidate>
                <div class="input-group">
                    <label for="loginInput">Email Address or Phone Number</label>
                    <input type="text" id="loginInput" name="login" placeholder="name@example.com or 07XXXXXXXX" autocomplete="username" required>
                </div>

                <div id="message" class="auth-message" role="alert"></div>

                <button type="submit" class="btn-submit" id="submitBtn">Send Reset Link</button>
            </form>

            <div id="devLink" style="display: none; margin-top: 16px; font-size: 0.8rem; background: #fffbeb; border: 1px solid #fde68a; color: #92400e; padding: 10px 12px; border-radius: 10px; word-break: break-all;"></div>

            <div style="margin-top: 24px; text-align: center; font-size: 0.875rem; color: var(--slate-muted);">
                Remembered it? <a href="login.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Log In</a>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const form = document.getElementById('forgotForm');
            const messageBox = document.getElementById('message');
            const btn = document.getElementById('submitBtn');

            function show(type, text) {
                messageBox.textContent = text;
                messageBox.className = 'auth-message ' + type;
            }

            function normalizeIdentifier(value) {
                const trimmed = String(value || '').trim();
                if (trimmed.includes('@')) return trimmed;
                let digits = trimmed.replace(/\D+/g, '');
                if (digits.length === 9 && /^[67]/.test(digits)) digits = '255' + digits;
                else if (digits.length === 10 && digits.startsWith('0')) digits = '255' + digits.slice(1);
                return /^255\d{9}$/.test(digits) ? digits : trimmed;
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                messageBox.className = 'auth-message';
                const login = normalizeIdentifier(document.getElementById('loginInput').value);
                if (!login) {
                    show('error', 'Please enter your email address or phone number.');
                    return;
                }

                btn.disabled = true;
                btn.textContent = 'Sending...';
                try {
                    const res = await fetch('api/password-reset.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ action: 'request', login: login })
                    });
                    let data;
                    try { data = await res.json(); } catch (_) { throw new Error('The password reset service is not responding. Please try again later.'); }
                    if (!res.ok || !data.success) throw new Error(data.message || 'Could not send the reset link.');

                    show('success', data.message + " If you don't see it within a few minutes, check your spam or junk folder and mark it as Not spam.");
                    form.style.display = 'none';
                    if (data.reset_url) {
                        const dev = document.getElementById('devLink');
                        dev.style.display = 'block';
                        dev.innerHTML = '<strong>Development mode:</strong> email delivery is simulated. Open this link to reset: <a href="' + data.reset_url.replace(/"/g, '&quot;') + '">' + data.reset_url.replace(/</g, '&lt;') + '</a>';
                    }
                } catch (err) {
                    show('error', err.message);
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Send Reset Link';
                }
            });
        })();
    </script>
</body>
</html>
