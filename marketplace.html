<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace — LipaLink</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #1769AA;
            --primary-hover: #12558c;
            --primary-light: #f0f7fc;
            --dark: #0f172a;
            --dark-subtle: #334155;
            --slate-muted: #64748b;
            --slate-light: #94a3b8;
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --radius-card: 16px;
            --radius-pill: 9999px;
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-page);
            color: var(--dark);
            line-height: 1.5;
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 72px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--dark);
            text-decoration: none;
        }

        .logo-box {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), #0f4c7d);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        .nav-panel {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 18px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--slate-muted);
            font-size: 0.86rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .nav-links a.active, .nav-links a:hover { color: var(--primary); }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mobile-toggle {
            display: none;
            margin-left: auto;
            background: none;
            border: none;
            font-size: 1.35rem;
            color: var(--dark);
            cursor: pointer;
            padding: 6px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: var(--radius-pill);
            text-decoration: none;
        }

        .btn-primary { background: var(--primary); color: #ffffff; }
        .btn-outline { background: #ffffff; color: var(--dark-subtle); border: 1px solid var(--border); }

        /* Page Hero */
        .page-hero {
            padding: 130px 0 40px 0;
            background: radial-gradient(circle at 85% 15%, #eaf4fd 0%, #f8fafc 55%);
            text-align: center;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-top: 30px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .product-img {
            height: 180px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--slate-muted);
        }

        .product-body {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img img { width: 100%; height: 100%; object-fit: cover; }

        .market-toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .market-toolbar .search-wrap { position: relative; flex: 1; min-width: 220px; }
        .market-toolbar .search-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .market-toolbar .search-wrap .market-input { padding-left: 38px; width: 100%; }
        .market-input {
            padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border); font: inherit; font-size: 0.9rem;
            background: #ffffff; color: var(--dark); outline: none; min-width: 180px;
        }
        .market-input:focus { border-color: var(--primary); }
        .market-notice { margin-top: 18px; padding: 12px 14px; border-radius: 10px; font-size: 0.85rem; background: #f0f7fc; color: var(--primary); border: 1px solid rgba(23, 105, 170, 0.22); }
        .market-notice.warn { background: #fffbeb; color: #92400e; border-color: #fde68a; }
        .product-badge { position: absolute; top: 12px; left: 12px; background: var(--primary); color: #fff; font-size: 0.7rem; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
        .product-img { position: relative; }
        .product-desc { font-size: 0.8rem; color: var(--slate-muted); margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .empty-market { grid-column: 1 / -1; text-align: center; padding: 40px 20px; border: 1px dashed #cbd5e1; border-radius: 14px; color: var(--slate-muted); }

        .skeleton-card .product-img { background: linear-gradient(90deg, #eef2f7 25%, #f8fafc 50%, #eef2f7 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
        .sk-line { height: 14px; border-radius: 6px; margin-bottom: 10px; background: linear-gradient(90deg, #eef2f7 25%, #f8fafc 50%, #eef2f7 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
        @keyframes shimmer { to { background-position: -200% 0; } }

        /* Footer */
        footer {
            background: var(--dark);
            color: var(--slate-light);
            padding: 50px 0 28px 0;
            margin-top: 60px;
        }

        @media (max-width: 1080px) {
            .mobile-toggle { display: inline-flex; }
            .nav-panel {
                display: none;
                position: absolute;
                top: 72px;
                left: 0;
                right: 0;
                background: #ffffff;
                border-bottom: 1px solid var(--border);
                flex-direction: column;
                align-items: stretch;
                padding: 8px 24px 20px;
                gap: 4px;
                box-shadow: 0 16px 30px rgba(15, 23, 42, 0.08);
                z-index: 1001;
            }
            .navbar.menu-open .nav-panel { display: flex; }
            .nav-links, .nav-actions { flex-direction: column; align-items: stretch; }
            .nav-links a, .nav-actions .btn { padding: 12px 4px; }
        }

        @media (max-width: 768px) {
            .products-grid { grid-template-columns: 1fr; }
            .page-hero h1 { font-size: 1.8rem !important; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-box"><i class="fa-solid fa-link"></i></div>
                LipaLink
            </a>
            <button class="mobile-toggle" aria-label="Toggle Menu" aria-expanded="false">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="nav-panel">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="how-it-works.html">How It Works</a></li>
                    <li><a href="marketplace.html" class="active">Marketplace</a></li>
                    <li><a href="for-sellers.html">For Sellers</a></li>
                    <li><a href="register-store.html">Register Store</a></li>
                    <li><a href="security.html">Security</a></li>
                </ul>
                <div class="nav-actions">
                    <a href="login.html" class="btn btn-outline">Log In</a>
                    <a href="register.html" class="btn btn-primary">Get Started</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="page-hero">
        <div class="container">
            <h1 style="font-size: 2.3rem; margin-bottom: 10px;">LipaLink Marketplace</h1>
            <p style="color: var(--slate-muted);">Explore products from verified merchants with transparent pay-small plans.</p>
        </div>
    </section>

    <section style="padding: 40px 0;">
        <div class="container">
            <div class="market-toolbar">
                <div class="search-wrap">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" id="productSearch" class="market-input" placeholder="Search products or sellers" aria-label="Search products">
                </div>
                <select id="categoryFilter" class="market-input" aria-label="Filter by category">
                    <option value="">All categories</option>
                </select>
                <span id="resultCount" style="font-size: 0.82rem; color: var(--slate-muted); white-space: nowrap;"></span>
            </div>

            <div id="marketNotice" class="market-notice" style="display: none;"></div>

            <div class="products-grid" id="productsGrid">
                <div class="product-card skeleton-card"><div class="product-img"></div><div class="product-body"><div class="sk-line" style="width: 70%;"></div><div class="sk-line" style="width: 40%;"></div><div class="sk-line" style="width: 100%; height: 56px; margin-top: 12px;"></div></div></div>
                <div class="product-card skeleton-card"><div class="product-img"></div><div class="product-body"><div class="sk-line" style="width: 70%;"></div><div class="sk-line" style="width: 40%;"></div><div class="sk-line" style="width: 100%; height: 56px; margin-top: 12px;"></div></div></div>
                <div class="product-card skeleton-card"><div class="product-img"></div><div class="product-body"><div class="sk-line" style="width: 70%;"></div><div class="sk-line" style="width: 40%;"></div><div class="sk-line" style="width: 100%; height: 56px; margin-top: 12px;"></div></div></div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container" style="text-align: center;">
            <p style="font-size: 0.875rem; color: #64748b;">© 2026 LipaLink. Pay at your pace.</p>
        </div>
    </footer>
    <script>
        const navbar = document.querySelector('.navbar');
        const toggle = document.querySelector('.mobile-toggle');
        if (navbar && toggle) {
            toggle.addEventListener('click', () => {
                const open = navbar.classList.toggle('menu-open');
                toggle.setAttribute('aria-expanded', String(open));
                toggle.innerHTML = open ? '<i class="fa-solid fa-xmark"></i>' : '<i class="fa-solid fa-bars"></i>';
            });
        }

        // ---------------- Marketplace: live products from api/products.php ----------------
        (function () {
            // Shown when the product service is unreachable (e.g. static hosting without PHP)
            const FALLBACK_PRODUCTS = [
                { id: null, name: 'Samsung Galaxy Smartphone', category: 'Electronics & Phones', price: 500000, installment_amount: 25000, installment_frequency: 'weekly', icon: 'fa-solid fa-mobile-screen', seller_name: 'Samsung Official Store', description: '128GB storage, 6.5-inch display, dual SIM.' },
                { id: null, name: 'Home Solar Power System', category: 'Home Solar & Appliances', price: 350000, installment_amount: 15000, installment_frequency: 'weekly', icon: 'fa-solid fa-solar-panel', seller_name: 'GreenEnergy Tz', description: 'Complete 200W solar kit with battery and inverter.' },
                { id: null, name: 'Business Laptop i5', category: 'Electronics & Phones', price: 850000, installment_amount: 40000, installment_frequency: 'weekly', icon: 'fa-solid fa-laptop', seller_name: 'TechHub Tanzania', description: 'Intel Core i5, 8GB RAM, 256GB SSD.' }
            ];

            let products = [];
            let signedIn = false;
            try { signedIn = Boolean(sessionStorage.getItem('lipalink_user')); } catch (_) { /* ignore */ }

            const grid = document.getElementById('productsGrid');
            const notice = document.getElementById('marketNotice');
            const searchEl = document.getElementById('productSearch');
            const categoryEl = document.getElementById('categoryFilter');

            function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
            function tzs(n) { return 'TZS ' + Math.round(Number(n) || 0).toLocaleString('en-US'); }
            function freq(f) { return { daily: 'day', weekly: 'week', biweekly: '2 weeks', monthly: 'month' }[f] || f; }

            function ctaFor(p) {
                if (p.id && signedIn) return 'agreement.html?product_id=' + encodeURIComponent(p.id);
                if (p.id) return 'login.html?next=' + encodeURIComponent('agreement.html?product_id=' + p.id);
                return signedIn ? 'agreement.html' : 'register.html';
            }

            function render() {
                const q = searchEl.value.trim().toLowerCase();
                const cat = categoryEl.value;
                const list = products.filter(function (p) {
                    if (cat && p.category !== cat) return false;
                    if (q && !((p.name || '') + ' ' + (p.seller_name || '') + ' ' + (p.description || '') + ' ' + (p.category || '')).toLowerCase().includes(q)) return false;
                    return true;
                });
                document.getElementById('resultCount').textContent = list.length + ' product' + (list.length === 1 ? '' : 's');

                if (list.length === 0) {
                    grid.innerHTML = '<div class="empty-market"><i class="fa-solid fa-box-open" style="font-size: 2rem; margin-bottom: 10px; display: block;"></i><strong>No products match your search.</strong><br>Try another keyword or category.</div>';
                    return;
                }

                grid.innerHTML = list.map(function (p) {
                    const img = p.image_url ? '<img src="' + esc(p.image_url) + '" alt="' + esc(p.name) + '" loading="lazy">' : '<i class="' + esc(p.icon || 'fa-solid fa-box') + '"></i>';
                    return '<div class="product-card">' +
                        '<div class="product-img">' + img + (p.featured ? '<span class="product-badge">Featured</span>' : '') + '</div>' +
                        '<div class="product-body"><div>' +
                        '<h4 style="font-size: 1.1rem;">' + esc(p.name) + '</h4>' +
                        '<p style="font-size: 0.8rem; color: var(--slate-muted); margin-bottom: 8px;"><i class="fa-solid fa-store" style="color: var(--primary);"></i> ' + esc(p.seller_name || 'Verified Seller') + (p.seller_location ? ' • ' + esc(p.seller_location) : '') + '</p>' +
                        (p.description ? '<p class="product-desc">' + esc(p.description) + '</p>' : '') +
                        '</div>' +
                        '<div style="background: var(--bg-page); padding: 12px; border-radius: 10px; margin-bottom: 16px;">' +
                        '<div style="display: flex; justify-content: space-between; font-size: 0.85rem;"><span>Total Price:</span> <strong>' + tzs(p.price) + '</strong></div>' +
                        '<div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-top: 4px;"><span>Pay Small:</span> <strong style="color: var(--primary);">' + tzs(p.installment_amount) + ' / ' + esc(freq(p.installment_frequency)) + '</strong></div>' +
                        '</div>' +
                        '<a href="' + ctaFor(p) + '" class="btn btn-primary" style="width: 100%; justify-content: center;">Start Payment Plan</a>' +
                        '</div></div>';
                }).join('');
            }

            function fillCategories(cats) {
                const current = categoryEl.value;
                categoryEl.innerHTML = '<option value="">All categories</option>' + cats.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');
                categoryEl.value = current;
            }

            async function load() {
                try {
                    const res = await fetch('api/products.php', { headers: { 'Accept': 'application/json' }, credentials: 'same-origin' });
                    if (!res.ok) throw new Error('Product service unavailable');
                    const data = await res.json();
                    const list = data.data && Array.isArray(data.data.products) ? data.data.products : [];
                    if (list.length === 0) {
                        products = FALLBACK_PRODUCTS;
                        notice.className = 'market-notice';
                        notice.textContent = 'No live listings yet. Showing sample products until sellers add their first items.';
                        notice.style.display = 'block';
                    } else {
                        products = list;
                        notice.style.display = 'none';
                    }
                    const cats = (data.data && data.data.categories && data.data.categories.length) ? data.data.categories
                        : Array.from(new Set(products.map(function (p) { return p.category; }).filter(Boolean)));
                    fillCategories(cats);
                } catch (_) {
                    products = FALLBACK_PRODUCTS;
                    fillCategories(Array.from(new Set(products.map(function (p) { return p.category; }))));
                    notice.className = 'market-notice warn';
                    notice.innerHTML = '<i class="fa-solid fa-plug-circle-xmark"></i> Live listings could not be loaded. Showing sample products.';
                    notice.style.display = 'block';
                }
                render();
            }

            searchEl.addEventListener('input', render);
            categoryEl.addEventListener('change', render);
            load();
        })();
    </script>
</body>
</html>
