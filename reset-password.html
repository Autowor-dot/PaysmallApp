<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a New Password — LipaLink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

    <header class="auth-nav">
        <a href="index.html" class="logo">
            <div class="logo-box"><i class="fa-solid fa-link"></i></div>
            LipaLink
        </a>
        <a href="login.html" class="btn-link">← Back to Log In</a>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-box" style="margin: 0 auto 10px auto; width: 42px; height: 42px; font-size: 1.1rem;"><i class="fa-solid fa-lock"></i></div>
                <h2>Choose a New Password</h2>
                <p>Use at least 8 characters with a mix of letters, numbers and symbols.</p>
            </div>

            <div id="message" class="auth-message" role="alert"></div>

            <form class="auth-form" id="resetForm" novalidate>
                <div class="input-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
                    <div class="strength-meter"><div class="strength-bar" id="strengthBar"></div></div>
                </div>
                <div class="input-group">
                    <label for="confirm">Confirm New Password</label>
                    <input type="password" id="confirm" name="confirm_password" autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Update Password</button>
            </form>

            <div id="expiredActions" style="display: none; margin-top: 16px; text-align: center;">
                <a href="forgot-password.html" class="btn-submit" style="display: inline-block; text-decoration: none; width: auto; padding: 12px 24px;">Request a new link</a>
            </div>

            <div style="margin-top: 24px; text-align: center; font-size: 0.875rem; color: var(--slate-muted);">
                <a href="login.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Back to Log In</a>
            </div>
        </div>
    </div>

    <script src="assets/js/password-toggle.js" defer></script>
    <script>
        (function () {
            const token = new URLSearchParams(window.location.search).get('token') || '';
            const form = document.getElementById('resetForm');
            const messageBox = document.getElementById('message');
            const btn = document.getElementById('submitBtn');
            const pw = document.getElementById('password');
            const bar = document.getElementById('strengthBar');

            function show(type, text) {
                messageBox.textContent = text;
                messageBox.className = 'auth-message ' + type;
            }

            function expired(text) {
                show('error', text);
                form.style.display = 'none';
                document.getElementById('expiredActions').style.display = 'block';
            }

            async function post(body) {
                const res = await fetch('api/password-reset.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(body)
                });
                let data;
                try { data = await res.json(); } catch (_) { throw new Error('The password reset service is not responding. Please try again later.'); }
                if (!res.ok || data.success === false) throw new Error(data.message || 'Request failed.');
                return data;
            }

            if (!token) {
                expired('This reset link is missing its token. Please request a new one.');
            } else {
                post({ action: 'validate', token: token })
                    .then(function (data) { if (data.valid === false) expired('This reset link is invalid or has expired. Please request a new one.'); })
                    .catch(function () { /* validation unavailable; allow the attempt and let the server decide */ });
            }

            pw.addEventListener('input', function () {
                const v = pw.value;
                let score = 0;
                if (v.length >= 8) score++;
                if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
                if (/\d/.test(v)) score++;
                if (/[^A-Za-z0-9]/.test(v)) score++;
                bar.style.width = (v.length === 0 ? 0 : Math.max(20, score * 25)) + '%';
                bar.style.backgroundColor = score <= 1 ? '#ef4444' : (score <= 2 ? '#f59e0b' : '#10b981');
            });

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                messageBox.className = 'auth-message';
                const password = pw.value;
                const confirm = document.getElementById('confirm').value;
                if (password.length < 8) { show('error', 'Your new password must be at least 8 characters long.'); return; }
                if (password !== confirm) { show('error', 'The passwords do not match.'); return; }

                btn.disabled = true;
                btn.textContent = 'Updating...';
                try {
                    await post({ action: 'reset', token: token, password: password, confirm_password: confirm });
                    show('success', 'Your password has been reset. Redirecting to login...');
                    setTimeout(function () { window.location.href = 'login.html?reset=1'; }, 1200);
                } catch (err) {
                    show('error', err.message);
                    btn.disabled = false;
                    btn.textContent = 'Update Password';
                }
            });
        })();
    </script>
</body>
</html>
